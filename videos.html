<script>
function filterVideos(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.video-card').forEach(function(card) {
    card.hidden = card.dataset.cat !== cat;
  });
}
// Handles the artifact build's statically pre-rendered cards (already in the
// DOM at parse time). The deploy build's cards arrive later via loadVideos(),
// which calls attachVideoFacade() itself after rendering — see shared_sheet.js.
document.querySelectorAll('.video-thumb').forEach(function(thumb) {
  thumb.addEventListener('click', function() {
    var card = thumb.closest('.video-card');
    var id = card.dataset.videoId;
    var title = card.dataset.title;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1';
    iframe.title = title;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    thumb.replaceChildren(iframe);
  });
});
</script>
<script>// Reads data from a published Google Sheet (no API key needed) via the gviz
// endpoint. Each page fetches whichever tab(s) it needs and renders its own
// list — see the bottom of this file for per-page render calls.
//
// SETUP: one Google Sheet with 3 tabs named exactly: concerts, videos, awards.
// Shared as "Anyone with the link" -> Viewer. Sheet ID is the part of its URL
// between /d/ and /edit.
const SHEET_ID = '1hfDZzsPNNuFxcWL_-Qg_e04K7XpDO9H5';

function fetchSheetTab(tabName) {
  // headers=1 tells Google's gviz endpoint row 1 is a header row — without
  // it, column labels come back empty and the header row itself shows up
  // as a fake first data row (found by testing against the real sheet).
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:json&headers=1&sheet=' + encodeURIComponent(tabName);
  return fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('sheet fetch failed: ' + r.status);
      return r.text();
    })
    .then(function(text) {
      var start = text.indexOf('(');
      var end = text.lastIndexOf(')');
      var json = JSON.parse(text.substring(start + 1, end));
      var cols = json.table.cols.map(function(c) { return c.label || c.id; });
      return json.table.rows.map(function(row) {
        var obj = {};
        row.c.forEach(function(cell, i) {
          obj[cols[i]] = cell ? (cell.f !== null && cell.f !== undefined ? cell.f : cell.v) : '';
        });
        return obj;
      });
    });
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ---- concerts (used by concerts.html full list, and homepage.html teaser) ----
function renderEventRow(r) {
  var hasPoster = r.poster_url && String(r.poster_url).trim() !== '';
  var poster = hasPoster
    ? '<img src="' + escapeHtml(r.poster_url) + '" alt="' + escapeHtml(r.title) + ' 海報">'
    : '';
  return '<div class="concert-card">' +
    '<div class="concert-poster' + (hasPoster ? '' : ' empty') + '">' + poster + '</div>' +
    '<div class="concert-meta">' +
    '<div class="concert-date">' + escapeHtml(r.date) + '</div>' +
    '<div class="concert-title">' + escapeHtml(r.title) + '</div>' +
    '<div class="concert-venue">' + escapeHtml(r.venue) + '</div>' +
    '</div></div>';
}

function loadConcerts(containerId, limit) {
  var el = document.getElementById(containerId);
  if (!el) return;
  fetchSheetTab('concerts').then(function(rows) {
    rows.sort(function(a, b) { return String(b.date).localeCompare(String(a.date)); });
    if (limit) rows = rows.slice(0, limit);
    el.innerHTML = rows.map(renderEventRow).join('');
  }).catch(function(err) {
    el.innerHTML = '<p style="color:var(--muted)">目前無法載入音樂會資料，請稍後再試。</p>';
    console.error(err);
  });
}

// ---- awards (used by about.html full list, and homepage.html teaser) ----
function renderAwardRow(r) {
  return '<li><b>' + escapeHtml(r.year) + '</b> ' + escapeHtml(r.description) + '</li>';
}

function loadAwards(containerId, limit) {
  var el = document.getElementById(containerId);
  if (!el) return;
  fetchSheetTab('awards').then(function(rows) {
    rows.sort(function(a, b) { return String(b.year).localeCompare(String(a.year)); });
    if (limit) rows = rows.slice(0, limit);
    el.innerHTML = rows.map(renderAwardRow).join('');
  }).catch(function(err) {
    el.innerHTML = '<li style="color:var(--muted)">目前無法載入資料，請稍後再試。</li>';
    console.error(err);
  });
}

// ---- videos (used by videos.html) ----
function renderVideoCard(r) {
  var thumbUrl = 'https://img.youtube.com/vi/' + encodeURIComponent(r.youtube_id) + '/hqdefault.jpg';
  return '<div class="video-card" data-cat="' + escapeHtml(r.category) + '" data-video-id="' +
    escapeHtml(r.youtube_id) + '" data-title="' + escapeHtml(r.title) +
    '"' + (r.category === 'classical' ? '' : ' hidden') + '>' +
    '<div class="video-thumb"><img src="' + thumbUrl + '" alt="' + escapeHtml(r.title) + '">' +
    '<div class="play-btn"></div></div>' +
    '<div class="video-title">' + escapeHtml(r.title) + '</div></div>';
}

function loadVideos(containerId) {
  var el = document.getElementById(containerId);
  if (!el) return;
  fetchSheetTab('videos').then(function(rows) {
    // No date column to sort by — instead, newest-added row (bottom of the
    // sheet) shows first, same "always add at the bottom" convention as
    // concerts/awards.
    rows.reverse();
    el.innerHTML = rows.map(renderVideoCard).join('');
    attachVideoFacade();
  }).catch(function(err) {
    el.innerHTML = '<p style="color:var(--muted)">目前無法載入影片資料，請稍後再試。</p>';
    console.error(err);
  });
}

function attachVideoFacade() {
  document.querySelectorAll('.video-thumb').forEach(function(thumb) {
    thumb.addEventListener('click', function() {
      var card = thumb.closest('.video-card');
      var id = card.dataset.videoId;
      var title = card.dataset.title;
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1';
      iframe.title = title;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      thumb.replaceChildren(iframe);
    });
  });
}
</script>
<script>loadVideos('videos-list');</script>
